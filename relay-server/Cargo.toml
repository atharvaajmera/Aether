[package]
name = "relay-server"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "relay-server"
path = "src/main.rs"

[lib]
name = "relay_server"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time"] }
plenum = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
